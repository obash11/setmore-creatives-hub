{
  "name": "Suggest an improvement",
  "description": "Suggest a practical improvement to the public website or showcase.",
  "title": "[Idea] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Describe the user need rather than sharing private information. This form does not create a booking, application or purchase."
      }
    },
    {
      "type": "dropdown",
      "id": "area",
      "attributes": {
        "label": "Area",
        "options": [
          "Public website",
          "Project documentation",
          "Accessibility or usability",
          "Project idea / collaboration"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "need",
      "attributes": {
        "label": "Who would this help, and what is the problem?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "proposal",
      "attributes": {
        "label": "Suggested improvement"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "success",
      "attributes": {
        "label": "What would a useful result look like?"
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Privacy check",
        "options": [
          {
            "label": "This proposal contains no credentials, private contact details or personal records.",
            "required": true
          }
        ]
      }
    }
  ]
}
